<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f7fc1" />
    <meta name="description" content="Petits Pas — suivez le développement et les souvenirs de vos enfants." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Petits Pas</title>
    <script>
      // Applique le thème avant le premier affichage (évite un flash clair en thème Lune).
      try {
        var theme = localStorage.getItem('petits-pas:theme')
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
